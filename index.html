<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lecture Quiz Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Quiz Companion</h1>
    <p class="subtitle">Entrepreneurship & Marketing Mix Study App</p>

    <!--══SETUP══-->
    <div class="screen" id="setupScreen">
      <!--══TOPIC SELECTOR══-->
      <div class="card">
        <div class="card-title">📚 Select Quiz Topic</div>
        <p class="card-desc">Choose one or more topics to load questions instantly, or mix them together.</p>
        <div class="topic-grid" id="topicGrid">
          <!-- Populated dynamically via JS -->
        </div>
        <div class="topic-actions" style="margin-top: 1.2rem; display: flex; gap: 0.7rem; flex-wrap: wrap;">
          <button class="btn btn-ghost" id="selectAllTopicsBtn" onclick="selectAllTopics()" style="font-size:0.82rem;padding:0.5rem 1rem;">Select All</button>
          <button class="btn btn-ghost" id="clearAllTopicsBtn" onclick="clearSelectedTopics()" style="font-size:0.82rem;padding:0.5rem 1rem;">Clear Selection</button>
        </div>
      </div>

      <div class="card">
        <div class="q-list-header" onclick="toggleCollapse()">
          <div class="card-title" style="margin-bottom:0;">⬡ Loaded Questions
            <span class="q-count-badge" id="qCountBadge">0</span>
          </div>
          <span class="collapse-icon" id="collapseIcon">▲</span>
        </div>
        <div id="questionsContainer" class="collapsed"></div>
      </div>

      <div class="row" style="justify-content:flex-end;">
        <button class="btn btn-primary" id="startBtn" onclick="startQuiz()" disabled>Start Quiz→</button>
      </div>
    </div>

    <!--══QUIZ══-->
    <div class="screen active" id="quizScreen">
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>

      <!--══QUESTION NAVIGATION RIBBON══-->
      <div class="q-nav-ribbon" id="qNavRibbon"></div>

      <div class="q-counter" id="qCounter">Question 1 of 1</div>
      <div class="q-text" id="qText"></div>
      <div class="options-list" id="optionsList"></div>
      <div class="row" style="justify-content:space-between; width: 100%;">
        <button class="btn btn-ghost" id="prevBtn" onclick="prevQuestion()" style="font-size:0.88rem;padding:0.6rem 1.2rem;">← Previous</button>
        <div style="display:flex; gap:0.8rem;">
          <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none">Next→</button>
          <button class="btn btn-accent2" id="finishBtn" onclick="showResults()" style="display:none">Finish & Review</button>
        </div>
      </div>
    </div>

    <!--══RESULTS══-->
    <div class="screen" id="resultsScreen">
      <div class="result-center">
        <div class="score-circle">
          <svg viewBox="0 0 136 136">
            <circle class="track" cx="68" cy="68" r="62" />
            <circle class="fill" cx="68" cy="68" r="62" id="scoreArc" stroke-dasharray="389.6" stroke-dashoffset="389.6" />
          </svg>
          <div class="score-num" id="scoreNum">0 / 0</div>
          <div class="score-label">Score</div>
        </div>
        <div class="result-title" id="resultTitle">Quiz Complete!</div>
        <div class="result-sub" id="resultSub"></div>
      </div>
      <div class="toggle-wrap">
        <div class="section-title" style="margin:0">Review Answers</div>
        <label class="toggle-label" onclick="toggleWrongOnly()">Wrong only <div class="toggle" id="wrongToggle"></div></label>
      </div>
      <div id="reviewList"></div>
      <div class="row" style="justify-content:center;margin-top:1.5rem;gap:0.8rem;">
        <button class="btn btn-ghost" onclick="backToSetup()">←Back to Setup</button>
        <button class="btn btn-ghost" onclick="resetQuiz()" style="color:var(--wrong); border-color:rgba(248,113,113,0.25);">Reset Quiz</button>
        <button class="btn btn-primary" onclick="restartQuiz()">Play Again</button>
      </div>
    </div>

    <script src="questions-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
